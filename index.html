  <!-- This website uses Umami Privacy focused analytics to get a sense for popularity. -->
  <!-- This script loader stops Umami from blocking the first-contentful paint -->
  <script>
    (function () {
      const UMAMI_SRC = "https://umami-production-78f2.up.railway.app/script.js";
      const WEBSITE_ID = "41a2f6dc-a7c4-4229-b48f-9ca84ef61f68";

      function loadUmami() {
        if (window.__umamiLoaded) return;
        window.__umamiLoaded = true;

        const s = document.createElement("script");
        s.src = UMAMI_SRC;
        s.async = true;
        s.setAttribute("data-website-id", WEBSITE_ID);
        s.setAttribute("data-domains", "tabbit.website,www.tabbit.website");
        s.setAttribute("data-exclude-search", "true");
        document.head.appendChild(s);
      }

      function scheduleUmami() {
        if ("requestIdleCallback" in window) {
          requestIdleCallback(loadUmami, { timeout: 5000 });
        } else {
          setTimeout(loadUmami, 3000);
        }
      }

      if (document.readyState === "complete") {
        scheduleUmami();
      } else {
        window.addEventListener("load", scheduleUmami, { once: true });
      }
    })();
  </script>
